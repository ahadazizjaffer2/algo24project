version: 0.2

env:
  variables:
    FLASK_APP: app.py
    FLASK_ENV: development

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - echo Installing dependencies...
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pytest

  pre_build:
    commands:
      - echo Pre-build phase complete
      - export PYTHONPATH=$PYTHONPATH:$(pwd)/algorithms  # Add the algorithms directory to the PYTHONPATH
      - echo Copying test data files into the working directory...
      - cp tests/test_cp.txt ./  # Copy test data to the current directory
      - cp tests/test_im.txt

  build:
    commands:
      - echo Running tests...
      - pytest --maxfail=1 --disable-warnings -q > result.log; tail -n 10 result.log

  post_build:
    commands:
      - echo Build complete!

artifacts:
  files:
    - '**/*'

cache:
  paths:
    - '/root/.cache/pip/**/*'
