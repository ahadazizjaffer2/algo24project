version: 0.2

env:
  variables:
    FLASK_APP: app.py
    FLASK_ENV: development

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - echo Installing dependencies...
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pytest

  pre_build:
    commands:
      - echo Pre-build phase complete
      - export PYTHONPATH=$PYTHONPATH:$(pwd)/algorithms  # Add the algorithms directory to the PYTHONPATH

  build:
    commands:
      - echo Running unit tests...
      - pytest --maxfail=1 --disable-warnings -q

  post_build:
    commands:
      - echo Build complete!
      - echo Test results
      - cat result.log

artifacts:
  files:
    - '**/*'
  base-directory: 'tests'

cache:
  paths:
    - '/root/.cache/pip/**/*'
